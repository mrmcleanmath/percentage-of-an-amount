<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Percent of an Amount — Mr. McLean Math</title>
<style>
  :root{
    --bg:#ffffff;
    --panel:#f7f8fa;
    --ink:#15171a;
    --muted:#62666d;
    --border:#d9dde3;
    --accent:#2563eb;
    --good:#177a38;
    --bad:#b42318;
    --focus:#f3b61f;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:Arial,Helvetica,sans-serif;
    line-height:1.5;
  }
  body.high-contrast{
    --bg:#000;
    --panel:#090909;
    --ink:#fff;
    --muted:#ddd;
    --border:#777;
    --accent:#00e5ff;
    --good:#5cff7a;
    --bad:#ff6b6b;
    --focus:#ffea00;
  }
  .container{max-width:820px;margin:0 auto;padding:20px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:clamp(28px,5vw,36px);margin:0}
  .mode-tabs,.difficulty{display:flex;gap:8px;flex-wrap:wrap}
  button{
    font:inherit;
    font-weight:700;
    padding:10px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--bg);
    color:var(--ink);
    cursor:pointer;
  }
  button:hover{border-color:var(--accent)}
  button:focus-visible,input:focus-visible{
    outline:3px solid var(--focus);
    outline-offset:2px;
  }
  button[aria-pressed="true"],.primary{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
  }
  .game{display:grid;gap:16px}
  .question{
    font-size:clamp(26px,5vw,34px);
    font-weight:700;
    text-align:center;
    padding:14px 8px;
  }
  .answer-row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
  input[type="text"]{
    width:min(260px,100%);
    font-size:22px;
    text-align:center;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--bg);
    color:var(--ink);
  }
  .feedback{
    min-height:28px;
    text-align:center;
    font-size:18px;
    font-weight:700;
  }
  .feedback.good{color:var(--good)}
  .feedback.bad{color:var(--bad)}
  .steps{
    margin:0 auto;
    max-width:620px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
  }
  .steps ol{margin:6px 0 0;padding-left:24px}
  .stats{
    display:flex;
    justify-content:center;
    gap:18px;
    color:var(--muted);
    font-size:15px;
  }
  .worksheet{display:none}
  .ws-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .ws-list{display:grid;gap:10px}
  .ws-item{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
  }
  .ws-answer{display:none;margin-top:6px;font-weight:700}
  .muted{color:var(--muted)}
  footer{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}
  .sr-only{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
  @media(max-width:560px){
    .container{padding:14px}
    .panel{padding:14px}
    .answer-row{align-items:stretch}
    input[type="text"], .answer-row button{width:100%}
  }
  @media print{
    header,.topbar,footer,.ws-controls button,.ws-reveal{display:none!important}
    body{background:#fff;color:#000}
    .container{max-width:none;padding:0}
    .panel{border:0;padding:0;background:#fff}
    .worksheet{display:block!important}
    .ws-item{break-inside:avoid;border:0;border-bottom:1px solid #bbb;border-radius:0}
    .ws-answer{display:none!important}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Percent of an Amount</h1>
    <div class="mode-tabs" role="group" aria-label="Mode">
      <button id="practiceBtn" aria-pressed="true">Practice</button>
      <button id="worksheetBtn" aria-pressed="false">Worksheet</button>
    </div>
  </header>

  <div class="topbar">
    <div class="difficulty" id="difficulty" role="group" aria-label="Difficulty">
      <button data-diff="foundation" aria-pressed="true">Foundation</button>
      <button data-diff="core" aria-pressed="false">Core</button>
      <button data-diff="challenge" aria-pressed="false">Challenge</button>
    </div>
    <button id="contrastBtn" aria-pressed="false">High contrast</button>
  </div>

  <section id="practice" class="panel game" aria-label="Practice mode">
    <div id="question" class="question" aria-live="polite"></div>

    <div class="answer-row">
      <input id="answer" type="text" inputmode="decimal" autocomplete="off"
             aria-label="Your answer" placeholder="Enter answer" />
      <button id="check" class="primary">Check</button>
      <button id="next" hidden>Next</button>
    </div>

    <div id="feedback" class="feedback" aria-live="polite"></div>
    <div id="steps" class="steps" hidden></div>

    <div class="stats" aria-live="polite">
      <span>Correct: <strong id="correctCount">0</strong></span>
      <span>Incorrect: <strong id="incorrectCount">0</strong></span>
    </div>
  </section>

  <section id="worksheet" class="panel worksheet" aria-label="Worksheet mode">
    <div class="ws-controls">
      <span class="muted">Questions:</span>
      <button data-size="5">5</button>
      <button data-size="10" class="primary">10</button>
      <button data-size="15">15</button>
      <button id="generateWs">Generate</button>
      <button id="revealAll">Reveal all</button>
      <button id="hideAll">Hide all</button>
      <button id="printWs">Print</button>
    </div>
    <div id="wsList" class="ws-list"></div>
  </section>

  <footer>Created by Mr. McLean Math</footer>
  <div id="live" class="sr-only" aria-live="assertive"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

const state = {
  mode: 'practice',
  difficulty: 'foundation',
  percent: 0,
  amount: 0,
  answer: 0,
  evaluated: false,
  correct: 0,
  incorrect: 0,
  worksheetSize: 10
};

function randInt(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

/*
  Preserve the original educational ranges:
  Easy      25–90%   of 5–30
  Medium    90–120%  of 10–60
  Hard      121–250% of 10–100

  Only the labels are standardized to Foundation/Core/Challenge.
*/
function generatePercentAmount(diff = state.difficulty){
  if(diff === 'foundation') return [randInt(25,90), randInt(5,30)];
  if(diff === 'core') return [randInt(90,120), randInt(10,60)];
  return [randInt(121,250), randInt(10,100)];
}

function exactPercentOfAmount(p,a){
  // p and a are integers, so p*a/100 has at most two decimal places.
  return (p*a)/100;
}

function formatNumber(n){
  const rounded = Math.round((n + Number.EPSILON) * 100) / 100;
  return String(rounded);
}

function parseAnswer(raw){
  const s = raw.trim().replace(/\s+/g,'').replace(',', '.');
  if(!s || !/^[+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)) return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function announce(msg){
  const live = $('#live');
  live.textContent = '';
  setTimeout(()=> live.textContent = msg, 10);
}

function newQuestion(){
  [state.percent,state.amount] = generatePercentAmount();
  state.answer = exactPercentOfAmount(state.percent,state.amount);
  state.evaluated = false;

  $('#question').textContent = `What is ${state.percent}% of ${state.amount}?`;
  $('#answer').value = '';
  $('#feedback').textContent = '';
  $('#feedback').className = 'feedback';
  $('#steps').hidden = true;
  $('#steps').innerHTML = '';
  $('#check').disabled = false;
  $('#next').hidden = true;
  $('#answer').disabled = false;
  $('#answer').focus();
}

function showSteps(){
  const decimal = state.percent / 100;
  $('#steps').innerHTML = `
    <strong>Worked steps</strong>
    <ol>
      <li>Convert the percent to a decimal: ${state.percent}% = ${formatNumber(decimal)}</li>
      <li>Multiply: ${formatNumber(decimal)} × ${state.amount}</li>
      <li>Answer: ${formatNumber(state.answer)}</li>
    </ol>`;
  $('#steps').hidden = false;
}

function checkAnswer(){
  if(state.evaluated) return;

  const value = parseAnswer($('#answer').value);
  if(value === null){
    $('#feedback').textContent = 'Enter an answer first.';
    $('#feedback').className = 'feedback bad';
    announce('Enter an answer first.');
    return;
  }

  state.evaluated = true;
  $('#check').disabled = true;
  $('#answer').disabled = true;
  $('#next').hidden = false;

  const correct = Math.abs(value - state.answer) < 1e-9;
  if(correct){
    state.correct++;
    $('#feedback').textContent = 'Correct!';
    $('#feedback').className = 'feedback good';
    announce('Correct');
  }else{
    state.incorrect++;
    $('#feedback').textContent = `Incorrect. Correct answer: ${formatNumber(state.answer)}`;
    $('#feedback').className = 'feedback bad';
    showSteps();
    announce('Incorrect');
  }

  $('#correctCount').textContent = state.correct;
  $('#incorrectCount').textContent = state.incorrect;
}

function setDifficulty(diff, button){
  state.difficulty = diff;
  $$('#difficulty button').forEach(b=>{
    const on = b === button;
    b.setAttribute('aria-pressed', String(on));
  });
  if(state.mode === 'practice') newQuestion();
}

$('#difficulty').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-diff]');
  if(btn) setDifficulty(btn.dataset.diff, btn);
});

$('#check').addEventListener('click', checkAnswer);
$('#next').addEventListener('click', newQuestion);

$('#answer').addEventListener('keydown', e=>{
  if(e.key === 'Enter'){
    if(state.evaluated) newQuestion();
    else checkAnswer();
  }else if(e.key === 'Escape' && !state.evaluated){
    $('#answer').value = '';
  }
});

function switchMode(mode){
  state.mode = mode;
  const practice = mode === 'practice';
  $('#practice').style.display = practice ? 'grid' : 'none';
  $('#worksheet').style.display = practice ? 'none' : 'block';
  $('#practiceBtn').setAttribute('aria-pressed', String(practice));
  $('#worksheetBtn').setAttribute('aria-pressed', String(!practice));

  if(practice){
    newQuestion();
  }else if(!$('#wsList').children.length){
    buildWorksheet();
  }
}

$('#practiceBtn').addEventListener('click', ()=>switchMode('practice'));
$('#worksheetBtn').addEventListener('click', ()=>switchMode('worksheet'));

$('#contrastBtn').addEventListener('click', ()=>{
  const on = document.body.classList.toggle('high-contrast');
  $('#contrastBtn').setAttribute('aria-pressed', String(on));
});

$$('button[data-size]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    state.worksheetSize = Number(btn.dataset.size);
    $$('button[data-size]').forEach(b=>b.classList.toggle('primary', b===btn));
    buildWorksheet();
  });
});

function buildWorksheet(){
  const list = $('#wsList');
  list.innerHTML = '';

  for(let i=1;i<=state.worksheetSize;i++){
    const [p,a] = generatePercentAmount();
    const ans = exactPercentOfAmount(p,a);

    const item = document.createElement('div');
    item.className = 'ws-item';
    item.innerHTML = `
      <div><strong>${i}.</strong> What is ${p}% of ${a}?</div>
      <button class="ws-reveal" aria-expanded="false">Reveal</button>
      <div class="ws-answer"><strong>Answer:</strong> ${formatNumber(ans)}</div>`;

    const reveal = item.querySelector('.ws-reveal');
    const answer = item.querySelector('.ws-answer');
    reveal.addEventListener('click', ()=>{
      const showing = answer.style.display === 'block';
      answer.style.display = showing ? 'none' : 'block';
      reveal.textContent = showing ? 'Reveal' : 'Hide';
      reveal.setAttribute('aria-expanded', String(!showing));
    });

    list.appendChild(item);
  }
}

$('#generateWs').addEventListener('click', buildWorksheet);
$('#revealAll').addEventListener('click', ()=>{
  $$('#wsList .ws-answer').forEach(a=>a.style.display='block');
  $$('#wsList .ws-reveal').forEach(b=>{
    b.textContent='Hide';
    b.setAttribute('aria-expanded','true');
  });
});
$('#hideAll').addEventListener('click', ()=>{
  $$('#wsList .ws-answer').forEach(a=>a.style.display='none');
  $$('#wsList .ws-reveal').forEach(b=>{
    b.textContent='Reveal';
    b.setAttribute('aria-expanded','false');
  });
});
$('#printWs').addEventListener('click', ()=>window.print());

/* Developer checks: add ?dev=1 to URL */
function runDevTests(){
  const tests = [];
  const assert = (name,cond)=>tests.push({name,pass:!!cond});

  assert('25% of 20 = 5', exactPercentOfAmount(25,20)===5);
  assert('125% of 40 = 50', exactPercentOfAmount(125,40)===50);
  assert('comma decimal accepted', parseAnswer('12,5')===12.5);
  assert('blank rejected', parseAnswer('')===null);
  assert('junk rejected', parseAnswer('12abc')===null);

  const ranges = {
    foundation:{p:[25,90],a:[5,30]},
    core:{p:[90,120],a:[10,60]},
    challenge:{p:[121,250],a:[10,100]}
  };
  for(const [diff,r] of Object.entries(ranges)){
    for(let i=0;i<5000;i++){
      const [p,a] = generatePercentAmount(diff);
      assert(`${diff} range`, p>=r.p[0] && p<=r.p[1] && a>=r.a[0] && a<=r.a[1]);
      const ans = exactPercentOfAmount(p,a);
      assert(`${diff} answer <= 2dp`, Math.abs(ans*100-Math.round(ans*100))<1e-9);
    }
  }

  console.table(tests.filter(t=>!t.pass));
  console.log(tests.every(t=>t.pass) ? 'DEV TESTS: PASS' : 'DEV TESTS: FAIL');
}

newQuestion();
if(new URLSearchParams(location.search).get('dev')==='1') runDevTests();
</script>
</body>
</html>
